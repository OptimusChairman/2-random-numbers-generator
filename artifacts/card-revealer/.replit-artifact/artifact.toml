kind = "web"
previewPath = "/card-revealer/"
title = "Card Number Revealer"
version = "1.0.0"
id = "artifacts/card-revealer"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/card-revealer/" ]
localPort = 22002

[services.development]
run = "pnpm --filter @workspace/card-revealer run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/card-revealer", "run", "build" ]
publicDir = "artifacts/card-revealer/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22002"
BASE_PATH = "/card-revealer/"
